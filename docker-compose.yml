# Boobo – Still-Tracker
# Für Portainer "Stacks → Add stack → Repository" gedacht: Portainer klont das Repo
# und baut das Image direkt auf dem NAS aus dem Dockerfile.
services:
  boobo:
    build: .
    image: boobo:local
    container_name: boobo
    ports:
      - "8099:8099"   # http: Home Assistant, Healthcheck, Zertifikat-Download
      - "8443:8443"   # https: für die Installation als App auf dem Handy
    volumes:
      # Variante A (Standard): benanntes Docker-Volume, Rechte passen automatisch.
      - boobo-data:/data
      # Variante B: Bind-Mount in einen Ordner auf dem NAS, z. B. (Synology) /volume1/docker/boobo.
      # Dazu die Zeile oben auskommentieren, diese aktivieren und den Ordner einmalig
      # dem Container-User (uid 1000 = `node`) geben:
      #   sudo mkdir -p /volume1/docker/boobo && sudo chown -R 1000:1000 /volume1/docker/boobo
      # - /volume1/docker/boobo:/data
    environment:
      - TZ=Europe/Berlin
      # Standard-Intervall in Minuten (3 h). Gilt nur beim ersten Start als Default;
      # danach wird der Wert aus den App-Einstellungen (SQLite) genommen.
      - FEED_INTERVAL_MINUTES=180
      # HTTPS mit eigener Zertifizierungsstelle (Zertifikate liegen im Volume unter /data/tls).
      # TLS_HOSTS = die Adresse(n), unter denen die App im Heimnetz aufgerufen wird: die LAN-IP des NAS
      # (im Router fest vergeben!), optional zusätzlich ein Name wie nas.local. 0 bei HTTPS_PORT schaltet ab.
      - HTTPS_PORT=8443
      - TLS_HOSTS=192.168.0.124
    restart: unless-stopped
    networks:
      boobo-net:
        # Feste Container-IP, damit sie nach Neustarts/Redeploys gleich bleibt.
        ipv4_address: 172.22.10.10

volumes:
  boobo-data:

networks:
  # Eigenes Bridge-Netz mit festem Subnetz (Bereich 172.22.x.x ist auf dem NAS frei).
  # Erreichbar ist die App im Heimnetz weiterhin über NAS-IP:8099 (Port-Mapping oben);
  # die feste IP hilft, wenn andere Container (z. B. Home Assistant) Boobo direkt ansprechen sollen.
  boobo-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.10.0/24
          gateway: 172.22.10.1
