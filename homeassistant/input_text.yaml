# Boobo – Helfer für „Rückgängig“ (merkt sich die ID des letzten Notierten aus HA)
#
# Einbinden in configuration.yaml:
#   input_text: !include homeassistant/input_text.yaml
# Oder in der UI: Einstellungen → Geräte & Dienste → Helfer → „Helfer erstellen“ → Text,
# Name „Boobo zuletzt notiert“ (ergibt input_text.boobo_letzter_eintrag).

boobo_letzter_eintrag:
  name: "Boobo zuletzt notiert"
  icon: mdi:identifier
  max: 20
